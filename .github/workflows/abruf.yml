name: HWK-Börse abholen

on:
  schedule:
    - cron: '23 4,14 * * *'   # zweimal am Tag (UTC), vor den Abrufen der Homepage
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: abruf
  cancel-in-progress: false

jobs:
  abruf:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Börse lesen
        run: php abruf.php
      - name: Speichern
        run: |
          if [ -n "$(git status --porcelain hwk.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add hwk.json
            git commit -m "HWK-Börse $(date -u +%Y-%m-%d)"
            git push
          fi
